[package]
name = "macexplorer-sftp-reader-qualification"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
agent-qualification = []
download-qualification = []
folder-download-qualification = ["download-qualification"]
upload-qualification = ["dep:sha2"]
inplace-edit-v1 = ["upload-qualification", "folder-download-qualification"]
remote-action-qualification = ["inplace-edit-v1"]
original-edit-qualification = ["upload-qualification", "folder-download-qualification"]

[[bin]]
name = "upload_probe"
path = "src/bin/upload_probe.rs"
required-features = ["upload-qualification"]

[[bin]]
name = "agent_fixture"
path = "src/bin/agent_fixture.rs"
required-features = ["agent-qualification"]

[[bin]]
name = "upload_worker"
path = "src/bin/upload_worker.rs"
required-features = ["upload-qualification", "download-qualification"]

[[bin]]
name = "download_probe"
path = "src/bin/download_probe.rs"
required-features = ["download-qualification"]

[[bin]]
name = "download_worker"
path = "src/bin/download_worker.rs"
required-features = ["download-qualification"]

[dependencies]
russh = { version = "=0.65.2", default-features = false, features = ["ring", "rsa"] }
russh-sftp = { version = "=3.0.1", default-features = false }
tokio = { version = "1", default-features = false, features = ["rt", "io-util", "net", "sync", "time", "macros"] }
rand = "=0.10.2"
bytes = "1"
zeroize = "=1.9.1"
ring = "=0.17.14"
# RSA is used only for public verification and bounded local component
# preparation. All private signatures still use the ring signer.
rsa = { version = "=0.10.0", default-features = false }
sha2 = { version = "=0.11.1", optional = true }

[profile.dev]
debug = false
incremental = false
strip = false

[profile.release]
debug = false
incremental = false
strip = false
