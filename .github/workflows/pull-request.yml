name: Pull request checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - .github/workflows/pull-request.yml
      - MacExplorer.xcodeproj/**
      - App/**
      - Packages/ExplorerKit/**
      - Workers/**
      - Vendor/**
      - Distribution/**
      - tools/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pull-request-checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon app and tests
            runner: xcode-27
            host-arch: arm64
            build-arch: arm64
            test-packages: true
            developer-dir: /Applications/Xcode_27.2.app/Contents/Developer
          - name: Intel package tests
            runner: macos-26-intel
            host-arch: x86_64
            test-packages: true
            developer-dir: /Applications/Xcode_26.6.app/Contents/Developer
          - name: Apple Silicon package tests on macOS 15
            runner: macos-15
            host-arch: arm64
            os-major: '15'
            test-packages: true
            developer-dir: /Applications/Xcode_26.3.app/Contents/Developer
          - name: Intel package tests on macOS 15
            runner: macos-15-intel
            host-arch: x86_64
            os-major: '15'
            test-packages: true
            developer-dir: /Applications/Xcode_26.3.app/Contents/Developer
          - name: Intel app cross-build
            runner: xcode-27
            host-arch: arm64
            build-arch: x86_64
            developer-dir: /Applications/Xcode_27.2.app/Contents/Developer
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: ${{ matrix.developer-dir }}
      TRAVERSE_CI_HOST: ${{ matrix.host-arch }}
      TRAVERSE_CI_OS_MAJOR: ${{ matrix.os-major }}
      TRAVERSE_CI_TARGET: ${{ matrix.build-arch }}
    steps:
      - name: Check out the proposed merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the toolchain
        run: |
          test "$(uname -m)" = "$TRAVERSE_CI_HOST"
          if [ -n "$TRAVERSE_CI_OS_MAJOR" ]; then
            version="$(sw_vers -productVersion)"
            test "${version%%.*}" = "$TRAVERSE_CI_OS_MAJOR"
          fi
          sw_vers
          xcodebuild -version
          xcrun swiftc --version
      - name: Inspect generated folder paths on macOS 15
        if: matrix.os-major == '15'
        run: |
          mkdir -p .build/swift-cache .build/tmp
          TMPDIR="$PWD/.build/tmp" xcrun swift -module-cache-path .build/swift-cache - "$PWD/.build" <<'SWIFT'
          import Darwin
          import Foundation

          let parent = URL(fileURLWithPath: CommandLine.arguments[1], isDirectory: true)
          let root = parent.appendingPathComponent("minimum-os-path-check", isDirectory: true)
          try FileManager.default.createDirectory(at: root, withIntermediateDirectories: false, attributes: [.posixPermissions: 0o700])
          defer { try? FileManager.default.removeItem(at: root) }
          let folder = root.appendingPathComponent("item")
          try FileManager.default.createDirectory(at: folder, withIntermediateDirectories: false, attributes: [.posixPermissions: 0o700])
          let typed = URL(fileURLWithPath: folder.path, isDirectory: true)
          for (label, url) in [("inferred directory", folder), ("explicit directory", typed), ("absent", root.appendingPathComponent("absent"))] {
              let standard = url.standardizedFileURL, resolved = url.resolvingSymlinksInPath()
              print("::notice title=Generated folder path::", label, "standard URL", url == standard, "resolved URL", url == resolved,
                    "standard path", url.path == standard.path, "resolved path", url.path == resolved.path)
          }
          let previous = getiopolicy_np(IOPOL_TYPE_VFS_MATERIALIZE_DATALESS_FILES, IOPOL_SCOPE_THREAD)
          let changed = setiopolicy_np(IOPOL_TYPE_VFS_MATERIALIZE_DATALESS_FILES, IOPOL_SCOPE_THREAD, IOPOL_MATERIALIZE_DATALESS_FILES_OFF)
          let current = getiopolicy_np(IOPOL_TYPE_VFS_MATERIALIZE_DATALESS_FILES, IOPOL_SCOPE_THREAD)
          print("::notice title=Thread file materialization policy::", previous, changed, current)
          if previous >= 0 { _ = setiopolicy_np(IOPOL_TYPE_VFS_MATERIALIZE_DATALESS_FILES, IOPOL_SCOPE_THREAD, previous) }
          var volume = statfs(), info = stat()
          print("::notice title=Private local fixture::", lstat(typed.path, &info) == 0 && info.st_uid == geteuid() && info.st_mode & 0o7777 == 0o700,
                statfs(typed.path, &volume) == 0 && volume.f_flags & UInt32(MNT_LOCAL) != 0)
          SWIFT
      - name: Install pinned Rust and fetch worker dependencies
        if: matrix.build-arch != ''
        run: python3 -B tools/worker_setup.py --install-toolchain --fetch --arch "$TRAVERSE_CI_TARGET"
      - name: Compile the unsigned app
        if: matrix.build-arch != ''
        id: compile
        run: |
          python3 -B tools/dev.py build --unsigned --arch "$TRAVERSE_CI_TARGET"
          test "$(xcrun lipo -archs '.build/xcode-unsigned/Build/Products/Debug/Mac Explorer.app/Contents/MacOS/Mac Explorer')" = "$TRAVERSE_CI_TARGET"
      - name: Show compiler diagnostics
        if: ${{ failure() && steps.compile.conclusion == 'failure' }}
        run: |
          for result in .build/results/build-*.xcresult; do
            if [ -d "$result" ]; then
              xcrun xcresulttool get build-results --path "$result" --compact | python3 -B -c '
          import json, sys
          result = json.load(sys.stdin)
          for issue in result.get("errors", [])[:16]:
              print(issue.get("issueType", "Build error"), issue.get("sourceURL", ""), issue.get("message", "")[:800])
          ' || true
            fi
          done
          df -h .
          /usr/bin/grep -E -i 'out of memory|no space left|terminated|killed|signal [0-9]+|failed with a nonzero exit code' .build/logs/build-*.log | tail -n 24 | cut -c1-1200 || true
          /usr/bin/grep -m 1 -B 4 -A 28 '^Stack dump:' .build/logs/build-*.log | cut -c1-1400 || true
      - name: Run ExplorerKit tests
        if: matrix.test-packages
        run: python3 -B tools/dev.py test --serial
