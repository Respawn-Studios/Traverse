name: Pull request checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - .github/workflows/pull-request.yml
      - MacExplorer.xcodeproj/**
      - App/**
      - Packages/ExplorerKit/**
      - Workers/**
      - Vendor/**
      - Distribution/**
      - tools/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pull-request-checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon app and tests
            runner: xcode-27
            host-arch: arm64
            build-arch: arm64
            test-packages: true
            developer-dir: /Applications/Xcode_27.2.app/Contents/Developer
          - name: Intel package tests
            runner: macos-26-intel
            host-arch: x86_64
            test-packages: true
            developer-dir: /Applications/Xcode_26.6.app/Contents/Developer
          - name: Apple Silicon package tests on macOS 15
            runner: macos-15
            host-arch: arm64
            os-major: '15'
            test-packages: true
            developer-dir: /Applications/Xcode_26.3.app/Contents/Developer
          - name: Intel package tests on macOS 15
            runner: macos-15-intel
            host-arch: x86_64
            os-major: '15'
            test-packages: true
            developer-dir: /Applications/Xcode_26.3.app/Contents/Developer
          - name: Intel app cross-build
            runner: xcode-27
            host-arch: arm64
            build-arch: x86_64
            developer-dir: /Applications/Xcode_27.2.app/Contents/Developer
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: ${{ matrix.developer-dir }}
      TRAVERSE_CI_HOST: ${{ matrix.host-arch }}
      TRAVERSE_CI_OS_MAJOR: ${{ matrix.os-major }}
      TRAVERSE_CI_TARGET: ${{ matrix.build-arch }}
    steps:
      - name: Check out the proposed merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the toolchain
        run: |
          test "$(uname -m)" = "$TRAVERSE_CI_HOST"
          if [ -n "$TRAVERSE_CI_OS_MAJOR" ]; then
            version="$(sw_vers -productVersion)"
            test "${version%%.*}" = "$TRAVERSE_CI_OS_MAJOR"
          fi
          sw_vers
          xcodebuild -version
          xcrun swiftc --version
      - name: Install pinned Rust and fetch worker dependencies
        if: matrix.build-arch != ''
        run: python3 -B tools/worker_setup.py --install-toolchain --fetch --arch "$TRAVERSE_CI_TARGET"
      - name: Compile the unsigned app
        if: matrix.build-arch != ''
        id: compile
        run: |
          python3 -B tools/dev.py build --unsigned --arch "$TRAVERSE_CI_TARGET"
          test "$(xcrun lipo -archs '.build/xcode-unsigned/Build/Products/Debug/Mac Explorer.app/Contents/MacOS/Mac Explorer')" = "$TRAVERSE_CI_TARGET"
      - name: Show compiler diagnostics
        if: ${{ failure() && steps.compile.conclusion == 'failure' }}
        run: |
          for result in .build/results/build-*.xcresult; do
            if [ -d "$result" ]; then
              xcrun xcresulttool get build-results --path "$result" --compact | python3 -B -c '
          import json, sys
          result = json.load(sys.stdin)
          for issue in result.get("errors", [])[:16]:
              print(issue.get("issueType", "Build error"), issue.get("sourceURL", ""), issue.get("message", "")[:800])
          ' || true
            fi
          done
          df -h .
          /usr/bin/grep -E -i 'out of memory|no space left|terminated|killed|signal [0-9]+|failed with a nonzero exit code' .build/logs/build-*.log | tail -n 24 | cut -c1-1200 || true
          /usr/bin/grep -m 1 -B 4 -A 28 '^Stack dump:' .build/logs/build-*.log | cut -c1-1400 || true
      - name: Run ExplorerKit tests
        if: matrix.test-packages
        env:
          TRAVERSE_CI_BOOKMARK_KEYCHAIN: ${{ matrix.os-major == '15' && matrix.host-arch == 'x86_64' && runner.environment == 'github-hosted' }}
        run: |
          if [[ "$TRAVERSE_CI_BOOKMARK_KEYCHAIN" == true ]]; then
            # ScopedBookmarkAgent requires an available per-user keychain on
            # this runner. Use an empty one owned by this job, without imports.
            keychain="$RUNNER_TEMP/traverse-bookmarks.keychain-db"
            test ! -e "$keychain"
            previous=$(/usr/bin/security default-keychain -d user 2>/dev/null | tr -d '"' | sed 's/^[[:blank:]]*//' || true)
            password=$(/usr/bin/openssl rand -hex 24)
            printf '::add-mask::%s\n' "$password"
            /usr/bin/security create-keychain -p "$password" "$keychain"
            finish_keychain() {
              if [[ -n "$previous" ]]; then /usr/bin/security default-keychain -d user -s "$previous"; fi
              /usr/bin/security delete-keychain "$keychain"
            }
            trap finish_keychain EXIT
            /usr/bin/security set-keychain-settings -lut 3600 "$keychain"
            /usr/bin/security unlock-keychain -p "$password" "$keychain"
            /usr/bin/security default-keychain -d user -s "$keychain"
            unset password
            python3 -B tools/dev.py test --serial --filter nativeReadOnlyReferenceUsesAResolvableScopedBookmark
          fi
          python3 -B tools/dev.py test --serial
